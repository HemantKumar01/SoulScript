agents:
  answer_reviewer_agent:
    type: instance
    models: [gemini-2.0-flash]
    tools: [get_next_question, follow_up_generator]
    params:
      name: AnswerReviewerAgent
      instruction: ['You are a helper agent to a mental therapist. The mental therapist has asked the user some question,
          and the user has provided an answer. Your task is to review the user''s answer and tell if the answer is complete
          or not. That is, you have to check if the user has answered all parts of the question asked by the therapist.',
        'If the answer is not complete, call the follow_up_generator agent tool to generate a follow-up question based on
          the user''s answer. Provide the therapist''s question and user''s answer as it is to the follow_up_generator tool
          (provide it as a single string).', 'If the answer is complete and satisfactory, (or the user tells they don''t want
          to answer the question) call the get_next_question tool to get the next question for the user. If the next question
          is not available, return empty string.', return only the question to be asked as a string and nothing else or empty
          string if no question provided.]
      description: Reviews user provided answers to therapy questions and determines if they are complete and provides the
        next question if available
      output_key: answer_review
  follow_up_generator:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: followUpAgent
      instruction: ['You are a follow-up question generator AI. The user has answered a question asked by the therapist, but
          not completely. Your task is to generate a follow-up question based on the user''s answer to a therapy question.']
      description: Generates a follow-up question based on the user's answer to a therapy question.
      output_key: follow_up
  progress_agent:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: ProgressAgent
      instruction: ['You are a progress tracking AI for a mental health therapy application. Your task is to analyze a set
          of questions and a conversation between a user and therapist, and determine the number of questions asked by the
          therapist and completely answered by the user. If same question is asked multiple times, it should be counted only
          once if answered completely. Also questions are asked serially, so if a question is not answered, any question after
          that should not be counted as answered.', 'Full Question Set: {questions_data}', 'Return only in the following format:',
        '{', '"answered_questions": <array of answered questions from full questoin set>,', '}', 'Note that the answered questions
          should be continuous, meaning if a question is not answered, any question after that should not be counted as answered.
          The conversation will be provided in the next message.']
      description: Analyzes a set of questions, and a conversation between a user and therapist, and determines the number
        of questions completely answered by the user.
      output_key: progress_agent
      output_schema: Progress

models:
  gemini-2.0-flash:
    type: literal
    agents: [follow_up_generator, answer_reviewer_agent, progress_agent]

tools:
  follow_up_generator:
    type: agent
    agents: [answer_reviewer_agent]
    params:
      wrapper: AgentTool
      agent: follow_up_generator
  get_next_question:
    type: function
    agents: [answer_reviewer_agent]
    params:
      description: |-
        Get next question for a user and update their current question

        Args:
            user_id (str): User ID from URL path
            user_response (str): User's response to the current question (optional)
        Returns:
            JSON response with next question or error

